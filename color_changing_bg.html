<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: rgb(100, 150, 200);
            transition: background-color 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .color-info {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 15px;
            color: white;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: slideUp 0.6s ease-out;
        }

        .color-info h1 {
            font-size: 28px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .color-display {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.8s ease-in-out;
        }

        .rgb-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .hex-text {
            font-size: 20px;
            margin-top: 10px;
            color: #ffff00;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }

        .color-box {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            margin: 20px auto;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            transition: all 0.8s ease-in-out;
            animation: pulse 2s ease-in-out infinite;
        }

        .instruction {
            font-size: 14px;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
        }

        .timer {
            font-size: 12px;
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.6);
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37),
                            inset 0 0 20px rgba(255, 255, 255, 0.1);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.5),
                            inset 0 0 30px rgba(255, 255, 255, 0.2);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 768px) {
            .color-info {
                padding: 30px 20px;
            }

            .color-info h1 {
                font-size: 22px;
            }

            .rgb-text {
                font-size: 18px;
            }

            .hex-text {
                font-size: 16px;
            }

            .color-box {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="color-info">
        <h1>🌈 Color Changer</h1>
        <p style="margin-bottom: 10px; font-size: 16px;">Background changes every 1 second</p>
        
        <div class="color-box"></div>
        
        <div class="color-display">
            <div class="rgb-text" id="rgbValue">rgb(100, 150, 200)</div>
            <div class="hex-text" id="hexValue">#6496C8</div>
        </div>
        
        <div class="instruction">
            ✨ Watch the background transform with smooth transitions
        </div>
        
        <div class="timer">
            Next color change in: <span id="countdown">1</span>s
        </div>
    </div>

    <script>
        // Function to generate random RGB color
        function getRandomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return { r, g, b };
        }

        // Function to convert RGB to HEX
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        // Function to update background color
        function updateBackgroundColor() {
            const color = getRandomColor();
            const rgbString = `rgb(${color.r}, ${color.g}, ${color.b})`;
            const hexString = rgbToHex(color.r, color.g, color.b);
            
            // Update body background
            document.body.style.backgroundColor = rgbString;
            
            // Update display values
            document.getElementById('rgbValue').textContent = rgbString;
            document.getElementById('hexValue').textContent = hexString;
            
            // Reset countdown
            resetCountdown();
        }

        // Function to handle countdown
        let countdownInterval;
        function resetCountdown() {
            clearInterval(countdownInterval);
            let countdown = 1;
            document.getElementById('countdown').textContent = countdown;
            
            countdownInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    countdown = 1;
                }
                document.getElementById('countdown').textContent = countdown;
            }, 100);
        }

        // Set initial color
        updateBackgroundColor();

        // Change background color every 1 second (1000ms)
        setInterval(updateBackgroundColor, 1000);

        // Add click event to manually change color
        document.addEventListener('click', updateBackgroundColor);

        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                updateBackgroundColor();
            }
        });
    </script>
</body>
</html>
